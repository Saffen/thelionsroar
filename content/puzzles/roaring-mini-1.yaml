id: roaring-mini-1
title: Roaring Mini No. 1
kicker: Puzzle Desk
teaser: A compact demo crossword powered by a single YAML config file.
intro: This first puzzle is deliberately tiny, but the same format works for larger themed crosswords.
difficulty: Easy
published: true
details: |
  The build system reads this YAML file, derives the grid from the entries, and renders a playable puzzle page automatically.

  Progress is saved locally in the browser, so a visitor can leave and resume later on the same device.
